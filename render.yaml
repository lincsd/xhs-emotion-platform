services:
  - type: web
    name: xhs-gemini-proxy
    env: python
    plan: standard
    autoDeploy: true
    buildCommand: python -m pip install --upgrade pip
    startCommand: python -u server.py
    healthCheckPath: /api/stats
    disk:
      name: xhs-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/data/xhsqg
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SMS_PROVIDER
        value: aliyun
      - key: ALIYUN_SMS_ACCESS_KEY_ID
        sync: false
      - key: ALIYUN_SMS_ACCESS_KEY_SECRET
        sync: false
      - key: ALIYUN_SMS_SIGN_NAME
        sync: false
      - key: ALIYUN_SMS_TEMPLATE_CODE_REGISTER
        sync: false
      - key: ALIYUN_SMS_TEMPLATE_CODE_LOGIN
        sync: false
      - key: ALIYUN_SMS_REGION_ID
        value: cn-hangzhou
      - key: ALIYUN_SMS_ENDPOINT
        value: dysmsapi.aliyuncs.com
